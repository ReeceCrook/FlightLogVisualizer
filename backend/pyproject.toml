[project]
name = "flightlog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reece", email = "reececrook16@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
]

[project.scripts]
flightlog = "flightlog:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = [
    # Tidy diffs and no merge conflicts over import order
    "I",
    # likely bugs, e.g. mutable default arguments
    "B",
    # Upgrades old syntax that has a modern equivalent
    "UP",
    # Datetimes created without a timezone/Enforced UTC
    "DTZ",
    # Pandas habits that cause bugs
    "PD",
    # Keeps test suite uniform as it grows
    "PT",
]

[tool.pytest]
addopts = ["-ra", "--import-mode=importlib", "--strict-markers"]
testpaths = ["tests"]